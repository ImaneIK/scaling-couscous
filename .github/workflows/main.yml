
name: the gentle breeze

on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Randomly decide
        id: choice
        run: |
          if [ "$((RANDOM % 3))" -eq 0 ]; then
            echo "commit=yes" >> "$GITHUB_OUTPUT"
          else
            echo "commit=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Update activity file
        if: steps.choice.outputs.commit == 'yes'
        run: |
          date -u +"Cloud workflow ran on %Y-%m-%d %H:%M" > activity.txt

      - name: Commit changes
        if: steps.choice.outputs.commit == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.txt
          git commit -m "Update activity log"
          git push
